apiVersion: v1
kind: ServiceAccount
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jwks-reader
rules:
- nonResourceURLs: 
  - "/openid/v1/jwks"
  - "/openid/*"
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jwks-proxy-binding
subjects:
- kind: ServiceAccount
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: jwks-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwks-proxy
  template:
    metadata:
      labels:
        app: jwks-proxy
    spec:
      serviceAccountName: jwks-proxy
      containers:
      - name: proxy
        image: python:3-alpine
        command:
        - /bin/sh
        - -c
        - |
          # set -e: a failed fetch must abort instead of starting the HTTP
          # server with an empty JWKS.
          # The old form was `curl ... > file`. Shell redirection creates the
          # file before the command runs, so whenever apk/curl were unavailable
          # it left a 0-byte file that looked like a successful fetch. Warehouses
          # then loaded an empty key set and rejected every JWT with 401.
          set -e
          mkdir -p /tmp/data/openid/v1
          echo "Fetching JWKS data..."
          # The image already ships python, and urllib can verify the API server
          # certificate straight from the ServiceAccount ca.crt. No apk add
          # needed, and no need to disable certificate verification.
          python - <<'PYEOF'
          import urllib.request, ssl

          token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
          ctx = ssl.create_default_context(
              cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
          req = urllib.request.Request(
              "https://kubernetes.default.svc.cluster.local/openid/v1/jwks",
              headers={"Authorization": "Bearer " + token})
          data = urllib.request.urlopen(req, context=ctx).read()

          # Reject an empty or malformed response instead of degrading silently.
          assert b'"keys"' in data and len(data) > 50, "unexpected JWKS content"

          # Write only after validation, so a failure leaves no partial file.
          with open("/tmp/data/openid/v1/jwks", "wb") as f:
              f.write(data)
          print("JWKS fetched: %d bytes" % len(data))
          PYEOF
          cd /tmp/data
          echo "Starting HTTP server on port 8080..."
          python -m http.server 8080 --bind 0.0.0.0
        ports:
        - containerPort: 8080
        readinessProbe:
          # Probe the actual content, not just the port: an empty JWKS keeps the
          # pod out of Ready, so the failure surfaces at deploy time instead of
          # being pushed downstream into the query path.
          exec:
            command:
            - /bin/sh
            - -c
            - test -s /tmp/data/openid/v1/jwks && grep -q '"keys"' /tmp/data/openid/v1/jwks
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jwks-http
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: jwks-proxy
  ports:
  - port: 80
    targetPort: 8080
