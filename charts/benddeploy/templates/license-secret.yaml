apiVersion: v1
kind: Secret
metadata:
  name: license-secret
type: Opaque
data:
  publicKey: 
  # The license must be supplied by the user (request one from hi@databend.com).
  #
  # No license is bundled on purpose. Every bundled one has expired in practice
  # (the previous values expired 2025-06-01 and 2025-08-03), and
  # licenseValidatorMiddleware returns 401 when validation fails, which blocks
  # sign-in entirely -- so a stale default is worse than none. Shipping a valid
  # one is not an option either: it is a commercial entitlement issued to a
  # specific customer.
  #
  # Pass it at install time:
  #   --set-string license="$(tr -d '\n' < benddeploy-license.b64)"
  #
  # The value is base64(base64(license-json)).
  license: {{ .Values.license | default "" | quote }}
