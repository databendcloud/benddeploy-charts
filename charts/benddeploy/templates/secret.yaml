apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
type: Opaque
data:
  SecretKey: N2U1ZDMzYTI3ZTVmNGY2NzFmZThmNWE0N2UxZmU3NjI=
  # The backend uses User/Password to initialize the default admin account on
  # startup. Password holds the hex md5 of the plaintext (SignIn compares
  # MD5Hash(input) directly, unsalted).
  #
  # The previous value 06690b17d9727149dfae9c2fddaac60b had no known plaintext,
  # so a fresh install could never sign in and needed an external script to
  # rewrite the row. Defaulting to md5("databend") makes helm install loginable.
  #
  # These defaults are a local/testing convenience. Override them for anything
  # that is not a throwaway cluster:
  #   helm install ... \
  #     --set-string jwtSecret.user=<user> \
  #     --set-string jwtSecret.passwordHash=$(printf '%s' '<password>' | md5sum | cut -d' ' -f1)
  # User: databend
  User: {{ .Values.jwtSecret.user | default "databend" | b64enc }}
  # Password: md5("databend") = 3af57862780586e0cf637ca89f99bfd0
  Password: {{ .Values.jwtSecret.passwordHash | default "3af57862780586e0cf637ca89f99bfd0" | b64enc }}